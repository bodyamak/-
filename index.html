<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐍 دودة - ادعوا لأحمد القطيشي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b1522;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Arial', 'Segoe UI', sans-serif;
            touch-action: none;  /* يمنع السحب والتمرير أثناء اللعب */
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #0f1a2b;
        }

        /* شريط النتيجة العلوي */
        .score-bar {
            padding: 12px 20px;
            background: #1a2e4a;
            color: #f5e37a;
            font-size: clamp(26px, 8vw, 48px);
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 3px solid #f4b836;
            letter-spacing: 2px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .score-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-value {
            background: #0b1522;
            padding: 6px 24px;
            border-radius: 60px;
            color: #ffd966;
            font-size: clamp(30px, 9vw, 52px);
            min-width: 100px;
            text-align: center;
            border: 2px solid #f4b836;
        }

        .restart-btn {
            background: #2e5a3b;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-size: clamp(22px, 6vw, 36px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #163320;
            transition: 0.1s ease;
            border: 2px solid #8fc97f;
            touch-action: manipulation;
            -webkit-appearance: none;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: none;
            background: #1e402a;
        }

        /* Canvas ملء الشاشة */
        canvas {
            display: block;
            flex: 1;
            width: 100%;
            height: calc(100dvh - 90px); /* ناقص شريط النتيجة */
            background: #142b3c;
            image-rendering: crisp-edges; /* لمظهر بكسل واضح */
            touch-action: none;
            cursor: pointer;
        }

        /* شاشة النهاية (overlay) */
        .gameover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 18, 28, 0.95);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            flex-direction: column;
            padding: 20px;
            touch-action: none;
        }

        .gameover-card {
            background: #1c3144;
            padding: 30px 20px;
            border-radius: 60px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 0 #0a121c, 0 10px 30px black;
            border: 4px solid #eab676;
        }

        .dua-text {
            color: #f3d9a4;
            font-size: clamp(28px, 8vw, 52px);
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #1f3a4e;
            word-break: break-word;
        }

        .final-score {
            color: #ffd966;
            font-size: clamp(36px, 10vw, 64px);
            background: #0f1f2b;
            display: inline-block;
            padding: 16px 48px;
            border-radius: 80px;
            margin: 20px 0;
            border: 3px solid #eab676;
        }

        .play-again-btn {
            background: #c49a3f;
            color: #0b1522;
            border: none;
            border-radius: 60px;
            padding: 20px 40px;
            font-size: clamp(30px, 8vw, 50px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #6d4c1e;
            transition: 0.1s;
            border: 3px solid #fbe4a0;
            margin-top: 20px;
            touch-action: manipulation;
        }

        .play-again-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6d4c1e;
        }

        /* إخفاء العناصر عند عدم الحاجة */
        .hidden {
            visibility: hidden;
        }

        /* دعم الأجهزة الصغيرة جداً */
        @media (max-width: 480px) {
            .score-bar {
                padding: 8px 12px;
            }
            .restart-btn {
                padding: 8px 18px;
            }
        }

        /* تعطيل scroll */
        html, body {
            overflow: hidden;
            height: 100%;
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- شريط النتيجة مع زر إعادة التشغيل -->
    <div class="score-bar">
        <div class="score-label">
            <span>🍎</span>
            <span>النقاط</span>
        </div>
        <div class="score-value" id="scoreDisplay">0</div>
        <button class="restart-btn" id="restartButton" aria-label="لعبة جديدة">🔄 جديد</button>
    </div>

    <!-- Canvas اللعبة -->
    <canvas id="gameCanvas"></canvas>

    <!-- شاشة النهاية (overlay) -->
    <div class="gameover-overlay" id="gameoverOverlay">
        <div class="gameover-card">
            <div class="dua-text">
                ادعوا لأحمد القطيشي بالرحمه<br>
                وصلّى الله على النبي ﷺ
            </div>
            <div class="final-score" id="finalScoreSpan">0</div>
            <button class="play-again-btn" id="overlayRestartBtn">▶️ العب مجدداً</button>
            <div style="margin-top: 24px; color: #b6cdda; font-size: 24px;">🕋 رحمه الله</div>
        </div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- إعدادات اللعبة ----------
        const GRID_SIZE = 18;          // 18x18 خلية (مناسب للشاشات)
        const INIT_SNAKE = [
            [8, 9],  // الرأس
            [7, 9],
            [6, 9]
        ];
        const INIT_DIR = 'RIGHT';
        const BASE_SPEED = 130;         // مللي ثانية لكل تحديث

        // ---------- المتغيرات العامة ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const finalScoreSpan = document.getElementById('finalScoreSpan');
        const gameoverOverlay = document.getElementById('gameoverOverlay');
        const restartBtn = document.getElementById('restartButton');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');

        // حالة اللعبة
        let snake = [...INIT_SNAKE.map(pos => [...pos])];
        let direction = INIT_DIR;
        let nextDirection = INIT_DIR;
        let food = [10, 10];
        let score = 0;
        let gameActive = false;
        let gameLoopInterval = null;
        let gameOverFlag = false;

        // أبعاد canvas ديناميكية
        let cellSize = 30;
        let offsetX = 0, offsetY = 0;

        // منع الانعكاس (لا يمكن العودة للخلف)
        const oppositeDir = {
            'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT'
        };

        // ---------- دوال مساعدة ----------
        function randomInt(max) {
            return Math.floor(Math.random() * max);
        }

        // توليد طعام في مكان فارغ
        function generateRandomFood() {
            const totalCells = GRID_SIZE * GRID_SIZE;
            if (snake.length >= totalCells) {
                // فوز نظري (نادر) لكن نتعامل معه كخسارة لطيفة
                return null;
            }
            const snakeSet = new Set(snake.map(seg => `${seg[0]},${seg[1]}`));
            let freeCells = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (!snakeSet.has(`${i},${j}`)) freeCells.push([i, j]);
                }
            }
            if (freeCells.length === 0) return null;
            return freeCells[randomInt(freeCells.length)];
        }

        // إنهاء اللعبة
        function triggerGameOver() {
            if (!gameActive || gameOverFlag) return;
            gameActive = false;
            gameOverFlag = true;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            // عرض النتيجة النهائية
            finalScoreSpan.textContent = score;
            gameoverOverlay.style.visibility = 'visible';
        }

        // إعادة ضبط كاملة
        function resetGame() {
            // إخفاء overlay
            gameoverOverlay.style.visibility = 'hidden';
            
            // إيقاف أي loop سابق
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }

            // إعادة الحالة الابتدائية
            snake = INIT_SNAKE.map(pos => [...pos]);
            direction = INIT_DIR;
            nextDirection = INIT_DIR;
            score = 0;
            gameActive = true;
            gameOverFlag = false;
            updateScoreDisplay();

            // توليد طعام صالح
            const newFood = generateRandomFood();
            if (newFood) food = newFood;
            else {
                // إذا حدث خطأ (نادر جداً) نضعه يدوياً
                food = [12, 12];
            }

            // بدء الحلقة
            startLoop();
            drawCanvas();
        }

        function startLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(() => {
                if (!gameActive) return;
                gameTick();
            }, BASE_SPEED);
        }

        // تحديث واجهة النتيجة
        function updateScoreDisplay() {
            scoreSpan.textContent = score;
        }

        // منطق الحركة والأكل والاصطدام
        function gameTick() {
            if (!gameActive) return;

            // تطبيق الاتجاه الجديد (بدون انعكاس)
            if (nextDirection && oppositeDir[nextDirection] !== direction) {
                direction = nextDirection;
            }

            // حساب رأس جديد
            const head = snake[0];
            let newHead = [...head];
            switch (direction) {
                case 'RIGHT': newHead[0] += 1; break;
                case 'LEFT':  newHead[0] -= 1; break;
                case 'UP':    newHead[1] -= 1; break;
                case 'DOWN':  newHead[1] += 1; break;
            }

            // التحقق من الاصطدام بالجدار
            if (newHead[0] < 0 || newHead[0] >= GRID_SIZE || newHead[1] < 0 || newHead[1] >= GRID_SIZE) {
                triggerGameOver();
                drawCanvas(); // تحديث الرسم لإظهار الحالة الأخيرة
                return;
            }

            // هل أكل التفاحة؟
            const isEating = (newHead[0] === food[0] && newHead[1] === food[1]);

            // بناء الأفعى الجديدة
            let newSnake = [newHead, ...snake];

            if (!isEating) {
                newSnake.pop(); // إزالة الذيل
            }

            // التحقق من اصطدام الرأس بالجسم (باستثناء الرأس نفسه)
            const headStr = `${newHead[0]},${newHead[1]}`;
            const bodyWithoutHead = newSnake.slice(1).map(seg => `${seg[0]},${seg[1]}`);
            if (bodyWithoutHead.includes(headStr)) {
                triggerGameOver();
                drawCanvas();
                return;
            }

            // تحديث الأفعى
            snake = newSnake;

            if (isEating) {
                score++;
                updateScoreDisplay();

                // توليد طعام جديد
                const newFood = generateRandomFood();
                if (newFood) {
                    food = newFood;
                } else {
                    // لا يوجد مكان فارغ -> فوز! نعامله كخاتمة ونعرض شاشة النهاية برسالة الدعاء (نفس السلوك)
                    triggerGameOver();
                    drawCanvas();
                    return;
                }
            }

            // إعادة رسم
            drawCanvas();
        }

        // ---------- الرسم على Canvas ----------
        function resizeCanvas() {
            const containerHeight = window.innerHeight;
            const barHeight = document.querySelector('.score-bar').offsetHeight;
            const availableHeight = containerHeight - barHeight;
            const availableWidth = window.innerWidth;

            // نحدد حجم الخلية بناءً على الأبعاد الأصغر
            const sizeByWidth = availableWidth / GRID_SIZE;
            const sizeByHeight = availableHeight / GRID_SIZE;
            cellSize = Math.floor(Math.min(sizeByWidth, sizeByHeight));
            
            canvas.width = GRID_SIZE * cellSize;
            canvas.height = GRID_SIZE * cellSize;
            
            // توسيط اللوحة (offset للرسم)
            offsetX = 0;
            offsetY = 0;
            
            drawCanvas();
        }

        function drawCanvas() {
            if (!canvas || !ctx) return;
            
            const w = canvas.width;
            const h = canvas.height;
            
            // خلفية
            ctx.fillStyle = '#1a3a4f';
            ctx.fillRect(0, 0, w, h);
            
            // رسم الشبكة (خطوط باهتة)
            ctx.strokeStyle = '#2a5a6f';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, h);
                ctx.strokeStyle = '#2e5f75';
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(w, i * cellSize);
                ctx.stroke();
            }

            // رسم التفاحة
            if (food) {
                const [fx, fy] = food;
                const x = fx * cellSize;
                const y = fy * cellSize;
                // ظل خفيف
                ctx.shadowColor = '#f00';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#e63434';
                ctx.beginPath();
                ctx.arc(x + cellSize/2, y + cellSize/2, cellSize*0.4, 0, 2*Math.PI);
                ctx.fill();
                // ورقة
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#7ec850';
                ctx.beginPath();
                ctx.ellipse(x + cellSize*0.65, y + cellSize*0.3, cellSize*0.15, cellSize*0.2, 0.4, 0, 2*Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
                // بذور
                ctx.fillStyle = '#5e2e1c';
                ctx.beginPath();
                ctx.arc(x + cellSize*0.35, y + cellSize*0.5, cellSize*0.06, 0, 2*Math.PI);
                ctx.fill();
            }

            // رسم الدودة
            if (snake.length > 0) {
                for (let i = 0; i < snake.length; i++) {
                    const [sx, sy] = snake[i];
                    const x = sx * cellSize;
                    const y = sy * cellSize;
                    
                    // تدرج لوني: الرأس أغمق
                    const isHead = (i === 0);
                    const gradient = ctx.createRadialGradient(
                        x + cellSize*0.3, y + cellSize*0.3, 2,
                        x + cellSize/2, y + cellSize/2, cellSize*0.7
                    );
                    if (isHead) {
                        gradient.addColorStop(0, '#6db36d');
                        gradient.addColorStop(1, '#1f6d1f');
                    } else {
                        gradient.addColorStop(0, '#8fce8f');
                        gradient.addColorStop(1, '#2d862d');
                    }
                    ctx.fillStyle = gradient;
                    
                    // حواف دائرية
                    const padding = isHead ? 2 : 3;
                    const radius = cellSize * 0.15;
                    ctx.beginPath();
                    ctx.roundRect(x+2, y+2, cellSize-4, cellSize-4, radius);
                    ctx.fill();
                    
                    // عيون للرأس
                    if (isHead) {
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(x + cellSize*0.65, y + cellSize*0.35, cellSize*0.12, 0, 2*Math.PI);
                        ctx.arc(x + cellSize*0.35, y + cellSize*0.35, cellSize*0.12, 0, 2*Math.PI);
                        ctx.fill();
                        ctx.fillStyle = '#0b1522';
                        ctx.beginPath();
                        ctx.arc(x + cellSize*0.7, y + cellSize*0.32, cellSize*0.07, 0, 2*Math.PI);
                        ctx.arc(x + cellSize*0.4, y + cellSize*0.32, cellSize*0.07, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }
            }

            // إذا كانت اللعبة غير نشطة (لكن لم تظهر overlay بعد) نرسم تأثير خفيف
            if (!gameActive && !gameOverFlag) {
                // حالة التوقف المؤقت نادرة
            }
        }

        // إضافة roundRect
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };

        // ---------- التحكم (كيبورد + لمس) ----------
        function handleKeydown(e) {
            if (!gameActive) return;
            const key = e.key;
            // منع التمرير بالأسهم
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)) {
                e.preventDefault();
            }
            
            let newDir = null;
            if (key === 'ArrowRight') newDir = 'RIGHT';
            else if (key === 'ArrowLeft') newDir = 'LEFT';
            else if (key === 'ArrowUp') newDir = 'UP';
            else if (key === 'ArrowDown') newDir = 'DOWN';
            
            if (newDir) {
                // لا نسمح بالانعكاس الفوري
                if (oppositeDir[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        }

        // التحكم باللمس (السحب)
        let touchStartX = 0, touchStartY = 0;
        let touchMoved = false;

        function handleTouchStart(e) {
            if (!gameActive) return;
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            if (!gameActive) return;
            e.preventDefault();
            if (!touchStartX) return;
            
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
            
            touchMoved = true;
            let newDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                newDir = dx > 0 ? 'RIGHT' : 'LEFT';
            } else {
                newDir = dy > 0 ? 'DOWN' : 'UP';
            }
            
            if (newDir && oppositeDir[newDir] !== direction) {
                nextDirection = newDir;
            }
            
            // إعادة تعيين لتجنب التغيير المستمر
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchStartX = 0;
        }

        // منع أحداث الفأرة الافتراضية
        function preventDefaults(e) {
            e.preventDefault();
        }

        // ---------- ربط الأحداث وبدء اللعبة ----------
        function bindEvents() {
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            
            document.addEventListener('keydown', handleKeydown);
            
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            
            // منع السحب خارج اللعبة
            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas || gameoverOverlay.contains(e.target)) {
                    e.preventDefault();
                }
            }, {passive: false});
            
            // إعادة التشغيل من الأزرار
            restartBtn.addEventListener('click', resetGame);
            overlayRestartBtn.addEventListener('click', resetGame);
            
            // النقر على overlay الخارج لا يفعل شيئاً
            gameoverOverlay.addEventListener('click', (e) => {
                if (e.target === gameoverOverlay) {
                    // لا تغلق إلا بالزر
                }
            });
        }

        // بداية أولية
        function init() {
            resizeCanvas();
            bindEvents();
            resetGame(); // يبدأ اللعبة مباشرة
        }

        init();
    })();
</script>
</body>
</html>
