<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐍 دودة - ادعوا لأحمد القطيشي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            background: #0b1522;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', 'Segoe UI', sans-serif;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%; /* سيتم ضبطه ديناميكيًا عبر JS */
            display: flex;
            flex-direction: column;
            background: #0f1a2b;
        }

        /* شريط النتيجة العلوي */
        .score-bar {
            padding: 12px 20px;
            background: #1a2e4a;
            color: #f5e37a;
            font-size: clamp(26px, 8vw, 48px);
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 3px solid #f4b836;
            letter-spacing: 2px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .score-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-value {
            background: #0b1522;
            padding: 6px 24px;
            border-radius: 60px;
            color: #ffd966;
            font-size: clamp(30px, 9vw, 52px);
            min-width: 100px;
            text-align: center;
            border: 2px solid #f4b836;
        }

        .restart-btn {
            background: #2e5a3b;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-size: clamp(22px, 6vw, 36px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #163320;
            transition: 0.1s ease;
            border: 2px solid #8fc97f;
            touch-action: manipulation;
            -webkit-appearance: none;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: none;
            background: #1e402a;
        }

        /* Canvas wrapper لضمان الملء */
        .canvas-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #142b3c;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* شاشة النهاية */
        .gameover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 18, 28, 0.95);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            flex-direction: column;
            padding: 20px;
            touch-action: none;
        }

        .gameover-card {
            background: #1c3144;
            padding: 30px 20px;
            border-radius: 60px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 0 #0a121c, 0 10px 30px black;
            border: 4px solid #eab676;
        }

        .dua-text {
            color: #f3d9a4;
            font-size: clamp(28px, 8vw, 52px);
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #1f3a4e;
            word-break: break-word;
        }

        .final-score {
            color: #ffd966;
            font-size: clamp(36px, 10vw, 64px);
            background: #0f1f2b;
            display: inline-block;
            padding: 16px 48px;
            border-radius: 80px;
            margin: 20px 0;
            border: 3px solid #eab676;
        }

        .play-again-btn {
            background: #c49a3f;
            color: #0b1522;
            border: none;
            border-radius: 60px;
            padding: 20px 40px;
            font-size: clamp(30px, 8vw, 50px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #6d4c1e;
            transition: 0.1s;
            border: 3px solid #fbe4a0;
            margin-top: 20px;
            touch-action: manipulation;
        }

        .play-again-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6d4c1e;
        }

        .hidden {
            visibility: hidden;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="score-bar">
        <div class="score-label">
            <span>🍎</span>
            <span>النقاط</span>
        </div>
        <div class="score-value" id="scoreDisplay">0</div>
        <button class="restart-btn" id="restartButton" aria-label="لعبة جديدة">🔄 جديد</button>
    </div>
    <div class="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<div class="gameover-overlay" id="gameoverOverlay">
    <div class="gameover-card">
        <div class="dua-text">
            ادعوا لأحمد القطيشي بالرحمه<br>
            وصلّى الله على النبي ﷺ
        </div>
        <div class="final-score" id="finalScoreSpan">0</div>
        <button class="play-again-btn" id="overlayRestartBtn">▶️ العب مجدداً</button>
        <div style="margin-top: 24px; color: #b6cdda; font-size: 24px;">🕋 رحمه الله</div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- إعدادات اللعبة ----------
        const GRID_SIZE = 18;
        const INIT_SNAKE = [[8,9],[7,9],[6,9]];
        const INIT_DIR = 'RIGHT';
        const BASE_SPEED = 130;

        // ---------- المتغيرات العامة ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const finalScoreSpan = document.getElementById('finalScoreSpan');
        const gameoverOverlay = document.getElementById('gameoverOverlay');
        const restartBtn = document.getElementById('restartButton');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');
        const gameContainer = document.getElementById('gameContainer');

        let snake = [...INIT_SNAKE.map(pos => [...pos])];
        let direction = INIT_DIR;
        let nextDirection = INIT_DIR;
        let food = [10, 10];
        let score = 0;
        let gameActive = false;
        let gameLoopInterval = null;
        let gameOverFlag = false;

        let cellSize = 30;
        let canvasWidth = 0, canvasHeight = 0;

        const oppositeDir = {
            'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT'
        };

        // ---------- دوال مساعدة ----------
        function randomInt(max) { return Math.floor(Math.random() * max); }

        function generateRandomFood() {
            const snakeSet = new Set(snake.map(seg => `${seg[0]},${seg[1]}`));
            let freeCells = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (!snakeSet.has(`${i},${j}`)) freeCells.push([i, j]);
                }
            }
            if (freeCells.length === 0) return null;
            return freeCells[randomInt(freeCells.length)];
        }

        function triggerGameOver() {
            if (!gameActive || gameOverFlag) return;
            gameActive = false;
            gameOverFlag = true;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            finalScoreSpan.textContent = score;
            gameoverOverlay.style.visibility = 'visible';
        }

        function resetGame() {
            gameoverOverlay.style.visibility = 'hidden';
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            
            snake = INIT_SNAKE.map(pos => [...pos]);
            direction = INIT_DIR;
            nextDirection = INIT_DIR;
            score = 0;
            gameActive = true;
            gameOverFlag = false;
            updateScoreDisplay();

            const newFood = generateRandomFood();
            food = newFood || [12, 12];

            startLoop();
            drawCanvas();
        }

        function startLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(() => {
                if (!gameActive) return;
                gameTick();
            }, BASE_SPEED);
        }

        function updateScoreDisplay() {
            scoreSpan.textContent = score;
        }

        function gameTick() {
            if (!gameActive) return;

            if (nextDirection && oppositeDir[nextDirection] !== direction) {
                direction = nextDirection;
            }

            const head = snake[0];
            let newHead = [...head];
            switch (direction) {
                case 'RIGHT': newHead[0] += 1; break;
                case 'LEFT':  newHead[0] -= 1; break;
                case 'UP':    newHead[1] -= 1; break;
                case 'DOWN':  newHead[1] += 1; break;
            }

            if (newHead[0] < 0 || newHead[0] >= GRID_SIZE || newHead[1] < 0 || newHead[1] >= GRID_SIZE) {
                triggerGameOver();
                drawCanvas();
                return;
            }

            const isEating = (newHead[0] === food[0] && newHead[1] === food[1]);
            let newSnake = [newHead, ...snake];
            if (!isEating) newSnake.pop();

            const headStr = `${newHead[0]},${newHead[1]}`;
            const bodyWithoutHead = newSnake.slice(1).map(seg => `${seg[0]},${seg[1]}`);
            if (bodyWithoutHead.includes(headStr)) {
                triggerGameOver();
                drawCanvas();
                return;
            }

            snake = newSnake;

            if (isEating) {
                score++;
                updateScoreDisplay();
                const newFood = generateRandomFood();
                if (newFood) food = newFood;
                else {
                    triggerGameOver();
                    drawCanvas();
                    return;
                }
            }
            drawCanvas();
        }

        // ---------- ضبط أبعاد Canvas ديناميكيًا ----------
        function resizeCanvas() {
            const containerRect = gameContainer.getBoundingClientRect();
            const scoreBar = document.querySelector('.score-bar');
            const scoreBarHeight = scoreBar.offsetHeight;
            
            // المساحة المتاحة للـ Canvas
            const availableWidth = containerRect.width;
            const availableHeight = containerRect.height - scoreBarHeight;

            // حساب حجم الخلية (مربع) بحيث يملأ المساحة بالكامل
            const sizeByWidth = availableWidth / GRID_SIZE;
            const sizeByHeight = availableHeight / GRID_SIZE;
            cellSize = Math.floor(Math.min(sizeByWidth, sizeByHeight));
            
            canvasWidth = GRID_SIZE * cellSize;
            canvasHeight = GRID_SIZE * cellSize;
            
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            
            drawCanvas();
        }

        // ---------- الرسم ----------
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };

        function drawCanvas() {
            if (!canvas || !ctx) return;
            
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.fillStyle = '#1a3a4f';
            ctx.fillRect(0, 0, w, h);
            
            // شبكة
            ctx.strokeStyle = '#2e5f75';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, h);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(w, i * cellSize);
                ctx.stroke();
            }

            // تفاحة
            if (food) {
                const [fx, fy] = food;
                const x = fx * cellSize;
                const y = fy * cellSize;
                ctx.shadowColor = '#f00';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#e63434';
                ctx.beginPath();
                ctx.arc(x + cellSize/2, y + cellSize/2, cellSize*0.4, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle = '#7ec850';
                ctx.beginPath();
                ctx.ellipse(x + cellSize*0.65, y + cellSize*0.3, cellSize*0.15, cellSize*0.2, 0.4, 0, 2*Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#5e2e1c';
                ctx.beginPath();
                ctx.arc(x + cellSize*0.35, y + cellSize*0.5, cellSize*0.06, 0, 2*Math.PI);
                ctx.fill();
            }

            // الدودة
            if (snake.length) {
                for (let i = 0; i < snake.length; i++) {
                    const [sx, sy] = snake[i];
                    const x = sx * cellSize;
                    const y = sy * cellSize;
                    const isHead = (i === 0);
                    const gradient = ctx.createRadialGradient(
                        x + cellSize*0.3, y + cellSize*0.3, 2,
                        x + cellSize/2, y + cellSize/2, cellSize*0.7
                    );
                    if (isHead) {
                        gradient.addColorStop(0, '#6db36d');
                        gradient.addColorStop(1, '#1f6d1f');
                    } else {
                        gradient.addColorStop(0, '#8fce8f');
                        gradient.addColorStop(1, '#2d862d');
                    }
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.roundRect(x+2, y+2, cellSize-4, cellSize-4, cellSize*0.15);
                    ctx.fill();
                    
                    if (isHead) {
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(x + cellSize*0.65, y + cellSize*0.35, cellSize*0.12, 0, 2*Math.PI);
                        ctx.arc(x + cellSize*0.35, y + cellSize*0.35, cellSize*0.12, 0, 2*Math.PI);
                        ctx.fill();
                        ctx.fillStyle = '#0b1522';
                        ctx.beginPath();
                        ctx.arc(x + cellSize*0.7, y + cellSize*0.32, cellSize*0.07, 0, 2*Math.PI);
                        ctx.arc(x + cellSize*0.4, y + cellSize*0.32, cellSize*0.07, 0, 2*Math.PI);
                        ctx.fill();
                    }
                }
            }
        }

        // ---------- التحكم ----------
        function handleKeydown(e) {
            if (!gameActive) return;
            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
            let newDir = null;
            if (e.key === 'ArrowRight') newDir = 'RIGHT';
            else if (e.key === 'ArrowLeft') newDir = 'LEFT';
            else if (e.key === 'ArrowUp') newDir = 'UP';
            else if (e.key === 'ArrowDown') newDir = 'DOWN';
            if (newDir && oppositeDir[newDir] !== direction) {
                nextDirection = newDir;
            }
        }

        let touchStartX = 0, touchStartY = 0;
        function handleTouchStart(e) {
            if (!gameActive) return;
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchMove(e) {
            if (!gameActive) return;
            e.preventDefault();
            if (!touchStartX) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
            
            let newDir = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                newDir = dx > 0 ? 'RIGHT' : 'LEFT';
            } else {
                newDir = dy > 0 ? 'DOWN' : 'UP';
            }
            if (newDir && oppositeDir[newDir] !== direction) {
                nextDirection = newDir;
            }
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchStartX = 0;
        }

        // ---------- مراقبة تغير حجم الحاوية ----------
        const resizeObserver = new ResizeObserver(() => {
            resizeCanvas();
        });
        resizeObserver.observe(gameContainer);

        // دعم visualViewport للهواتف
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
            window.visualViewport.addEventListener('scroll', resizeCanvas);
        }

        // أحداث إضافية
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 30));

        // ---------- ربط الأحداث ----------
        function bindEvents() {
            document.addEventListener('keydown', handleKeydown);
            
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            
            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas || gameoverOverlay.contains(e.target)) {
                    e.preventDefault();
                }
            }, {passive: false});
            
            restartBtn.addEventListener('click', resetGame);
            overlayRestartBtn.addEventListener('click', resetGame);
        }

        function init() {
            bindEvents();
            resizeCanvas();  // تأكيد الأبعاد الأولية
            resetGame();
        }

        init();
    })();
</script>
</body>
</html>
